name: Deploy Backend to Yegara Host

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Navigate directly into the Backend directory
            cd /home/${{ secrets.SSH_USERNAME }}/emwa.mudaymarketing.com/Backend
            
            # Pull latest changes from GitHub
            git pull origin main
            
            # Install production dependencies inside Backend/
            npm ci --only=production
            
            # Build application if using TypeScript / NestJS
            npm run build --if-present
            
            # Restart Phusion Passenger process
            mkdir -p tmp
            touch tmp/restart.txt
