name: Deploy EMWA Frontend to ethmwa.org via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to ethmwa.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://emwa.mudaymarketing.com/api/v1' }}
          VITE_GLOBAL_VOICES_API_URL: ${{ vars.VITE_GLOBAL_VOICES_API_URL || secrets.VITE_GLOBAL_VOICES_API_URL || '' }}
        run: npm run build

      - name: Deploy to Server via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT || secrets.FTP_PORT || '21' }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftp' }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || 'public_html/' }}
        run: |
          npm install --no-save basic-ftp
          node ./scripts/deploy-ftp.mjs
